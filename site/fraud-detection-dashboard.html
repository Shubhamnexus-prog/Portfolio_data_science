<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F5">
  <title>Credit Card Fraud Detection | Project Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard-theme.css">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        console.warn('Saved theme preference could not be read.', error);
      }
    })();
  </script>
</head>
<body>
  <header class="dash-nav">
    <div class="dash-nav-inner">
      <a class="dash-brand" href="index.html">Shubham Gupta</a>
      <div class="dash-actions">
        <a class="back-link" href="index.html#projects">All projects</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme" title="Switch colour theme">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="dashboard-wrap">
    <section class="dashboard-hero">
      <span class="eyebrow">Imbalanced classification</span>
      <h1 id="dashboard-title">Credit Card Fraud Detection</h1>
      <p id="dashboard-description"></p>
    </section>
    <section class="metric-grid" id="dashboard-metrics" aria-label="Project highlights"></section>
    <div class="dashboard-grid">
      <section class="panel">
        <h2>Model scorecard</h2>
        <p class="panel-intro">Reported evaluation metrics from the project.</p>
        <div class="score-list" id="dashboard-scores"></div>
        <p class="takeaway"><b>Project outcome:</b> <span id="dashboard-takeaway"></span></p>
      </section>
      <section class="panel">
        <h2>Project workflow</h2>
        <p class="panel-intro">The steps described for this project.</p>
        <ol class="workflow" id="dashboard-workflow"></ol>
      </section>
    </div>
    <p class="dashboard-foot">Project summary based on the information published in the portfolio.</p>
  </main>
  <script id="dashboard-data" type="application/json">
    {
      "title": "Credit Card Fraud Detection",
      "description": "A fraud-detection workflow designed for highly imbalanced transaction data, combining resampling and feature engineering with threshold tuning.",
      "metrics": [
        {"value": "284,807", "label": "Transactions analysed"},
        {"value": "0.17%", "label": "Fraud prevalence"},
        {"value": "0.97", "label": "Reported PR-AUC"},
        {"value": "35%", "label": "Fewer false negatives after threshold tuning"}
      ],
      "scores": [
        {"label": "Precision-recall AUC", "display": "0.97", "percent": 97},
        {"label": "False-negative reduction", "display": "35%", "percent": 35}
      ],
      "workflow": ["Analyse transaction data and class imbalance", "Apply SMOTE and undersampling", "Engineer predictive features", "Train and evaluate classification models", "Tune the decision threshold"],
      "takeaway": "The portfolio reports a 0.97 PR-AUC and a 35% reduction in false negatives after threshold tuning."
    }
  </script>
  <script src="dashboard-theme.js"></script>
  <script src="project-dashboard.js"></script>
</body>
</html>
